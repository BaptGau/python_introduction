[project]
name = "python-introduction"
version = "0.1.0"
description = "Cours et exercices d'introduction à Python"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["exercices"]
addopts = "-ra"
